[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auvbrain"
version = "0.2.0"
description = "Autonomous underwater vehicle (AUV) decision engine + control hub (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AUVBrain Contributors"}]
dependencies = [
  # Web framework + server
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  # Data / validation
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  # HTTP client (LLM providers + webhook)
  "httpx>=0.27.0",
  # Database (async SQLAlchemy + asyncpg for Postgres)
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29.0",
  # SQLite async driver (dev / CI without Postgres)
  "aiosqlite>=0.20.0",
  # Auth
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
raspi = [
  "gpiozero>=2.0",
]
local-llm = [
  "llama-cpp-python>=0.2.90",
]
rag = [
  "chromadb>=0.5.0",
  # pgvector Python client for production ANN search
  "pgvector>=0.3.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",        # async test client
  "ruff>=0.5.0",
  "matplotlib>=3.8",
  # Migrations
  "alembic>=1.13.0",
]

[project.scripts]
auv-api      = "auvbrain.api.main:run"
auv-agent    = "auvbrain.agent.main:run"
auv-keys     = "auvbrain.auth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in function defaults

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source  = ["src/auvbrain"]
branch  = true
omit    = ["*/raspi_gpio.py"]   # hardware-only; not runnable in CI

[tool.coverage.report]
fail_under = 70
show_missing = true
